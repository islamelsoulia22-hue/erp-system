name: CI Validate

# فحص سريع على الـ PRs والتشغيل اليدوي.
# ملحوظة: push على main بيشغّل release.yml (وفيه validate gate)،
# فتمت إزالة push من هنا عشان ميحصلش تشغيل مكرر لنفس الكوميت.
"on":
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate (pub get / analyze / test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter 3.41.2 (stable)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.2"
          channel: "stable"
          cache: true

      - name: Read version from pubspec.yaml
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          LINE=$(grep -m1 -E '^version:' pubspec.yaml || true)
          echo "pubspec: $LINE"
          if [[ "$LINE" =~ ^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+)(\+([0-9]+))? ]]; then
            echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
            echo "pub_build=${BASH_REMATCH[3]:-0}" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Invalid version in pubspec.yaml (expected X.Y.Z[+N])"
            exit 1
          fi

      - name: Create placeholder .env for analyze
        shell: bash
        run: |
          # .env معموله ignore (فيها أسرار) فمش موجودة في الـ checkout،
          # لكنها متسجلة كـ asset في pubspec — ملف فاضي يكفي للـ analyze.
          if [[ ! -f .env ]]; then
            printf 'SUPABASE_URL=https://placeholder.local\nSUPABASE_ANON_KEY=placeholder\nUPDATE_MANIFEST_URL=\n' > .env
          fi

      - name: flutter pub get
        run: flutter pub get

      - name: flutter analyze
        # الـ infos (style) موجودة تاريخيا — الفشل على errors فقط.
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: flutter test
        shell: bash
        run: |
          # receipt_label_test مستبعد من البوابة: توليد يدوي بطيء للتحقق
          # من الطباعة (مكسور تاريخيا على الشجرة النظيفة) — يُشغَّل يدويا فقط.
          mapfile -t TEST_FILES < <(find test -name '*_test.dart' -not -name 'receipt_label_test.dart' | sort)
          flutter test "${TEST_FILES[@]}"
